# 静态站点发布：推送到 main 或数据更新后自动部署 GitHub Pages
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [data-refresh]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 部署时先跑一轮抓取，保证数据尽量新鲜（失败不阻塞部署）
      - name: 抓取最新数据
        run: node scripts/fetch.mjs || true

      - name: 上传静态产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
